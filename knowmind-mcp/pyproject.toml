[project]
name = "knowmind-mcp"
version = "0.1.0"
description = "KnowMind MCP 工具集：文件写入、文档检索与联网搜索等"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1",
  "mcp>=1.6.0",
  "httpx>=0.27.0",
]

[project.scripts]
knowmind-file-writer = "file_writer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["file_writer*", "web_search*", "kb_search*", "arxiv*", "semantic_scholar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
