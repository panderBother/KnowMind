[project]
name = "knowmind"
version = "0.1.0"
description = "KnowMind 单仓：Python 子包由 uv 统一解析；前端 knowmind-web 仍用 npm（见 package.json）。"
requires-python = ">=3.11"
dependencies = [
    "knowmind-server",
    "knowmind-agent",
    "knowmind-eval",
    "knowmind-mcp",
]

[tool.uv.sources]
knowmind-server = { workspace = true }
knowmind-agent = { workspace = true }
knowmind-eval = { workspace = true }
knowmind-mcp = { workspace = true }

[tool.uv.workspace]
members = ["knowmind-server", "knowmind-agent", "knowmind-eval", "knowmind-mcp"]

# 开发时：`uv sync --group dev`（pytest / ruff 等；与各子包 optional dev 互补）
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["knowmind-server/tests", "knowmind-eval/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
