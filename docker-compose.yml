# KnowMind 生产部署（Docker Compose）
# 启动：cp .env.docker.example .env.docker && 编辑密码与 API Key
#       docker compose --env-file .env.docker up -d --build
# 日志：docker compose logs -f api
# 停止：docker compose down

services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: knowmind
      MYSQL_USER: knowmind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: always
    environment:
      DATABASE_URL: mysql+asyncmy://knowmind:${MYSQL_PASSWORD}@mysql:3306/knowmind
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      INGEST_BACKGROUND_THREAD: ${INGEST_BACKGROUND_THREAD:-true}
      CELERY_TASK_ALWAYS_EAGER: "false"
      EDGEFN_API_KEY: ${EDGEFN_API_KEY:-}
      EDGEFN_API_BASE_URL: ${EDGEFN_API_BASE_URL:-https://api.edgefn.net/v1}
      EDGEFN_CHAT_MODEL: ${EDGEFN_CHAT_MODEL:-DeepSeek-R1-0528-Qwen3-8B}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-http}
      EMBEDDING_HTTP_BASE_URL: ${EMBEDDING_HTTP_BASE_URL:-https://api.edgefn.net/v1}
      EMBEDDING_HTTP_API_KEY: ${EMBEDDING_HTTP_API_KEY:-}
      EMBEDDING_HTTP_MODEL: ${EMBEDDING_HTTP_MODEL:-BAAI/bge-m3}
      EXTERNAL_MCP_STDIO_ENABLED: "false"
      USER_WORKSPACE_ROOT: ${USER_WORKSPACE_ROOT:-data/user_workspaces}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-20}
      CHAT_DAILY_QUOTA: ${CHAT_DAILY_QUOTA:-200}
      UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-20}
      UPLOAD_DAILY_QUOTA: ${UPLOAD_DAILY_QUOTA:-100}
      RATE_LIMIT_TRUST_PROXY_HEADERS: ${RATE_LIMIT_TRUST_PROXY_HEADERS:-true}
      STORAGE_LOCAL_ROOT: data/storage
      CHROMA_DATA_PATH: data/chroma
      WHOOSH_INDEX_ROOT: data/whoosh
    volumes:
      - knowmind-data:/app/knowmind-server/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  worker:
    profiles: ["celery"]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: always
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "-l", "info"]
    environment:
      DATABASE_URL: mysql+asyncmy://knowmind:${MYSQL_PASSWORD}@mysql:3306/knowmind
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      INGEST_BACKGROUND_THREAD: "false"
      CELERY_TASK_ALWAYS_EAGER: "false"
      EDGEFN_API_KEY: ${EDGEFN_API_KEY:-}
      EDGEFN_API_BASE_URL: ${EDGEFN_API_BASE_URL:-https://api.edgefn.net/v1}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-http}
      EMBEDDING_HTTP_BASE_URL: ${EMBEDDING_HTTP_BASE_URL:-https://api.edgefn.net/v1}
      EMBEDDING_HTTP_API_KEY: ${EMBEDDING_HTTP_API_KEY:-}
      STORAGE_LOCAL_ROOT: data/storage
      CHROMA_DATA_PATH: data/chroma
      WHOOSH_INDEX_ROOT: data/whoosh
    volumes:
      - knowmind-data:/app/knowmind-server/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  knowmind-data:
