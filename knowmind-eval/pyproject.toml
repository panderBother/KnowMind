[project]
name = "knowmind-eval"
version = "0.1.0"
description = "RAGAS / 自定义指标评估流水线与报告输出"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0.0",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
ragas = ["ragas>=0.2.0", "langchain-openai>=0.2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipelines*"]
