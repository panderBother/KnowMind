name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check knowmind-server knowmind-agent knowmind-eval knowmind-mcp
      - run: uv run pytest knowmind-server/tests knowmind-eval/tests knowmind-mcp/tests -q
      - run: uv run python knowmind-eval/pipelines/run_eval.py --mode offline --fail-under 0.60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace knowmind-web run lint
      - run: npm --workspace knowmind-web run test:coverage
      - run: npm --workspace knowmind-web run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace knowmind-web run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: knowmind-web/playwright-report/
          retention-days: 14

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uvx bandit -r knowmind-server/app knowmind-agent knowmind-mcp -ll
      - run: npm ci
      - run: npm audit --audit-level=high
